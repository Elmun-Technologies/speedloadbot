name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # openai-whisper pulls in torch (~2 GB). The transcription tests skip
          # automatically when whisper is absent, so CI installs everything else.
          grep -v '^openai-whisper' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest aiosqlite fakeredis

      - name: Run tests
        run: python -m pytest tests/ -q
